name: Newgrounds

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - ng-release
    # Uncomment if we want to restrict when this build runs
    # paths:
    #   - 'Project.xml'
    #   - 'assets/**'
    #   - 'source/**'

jobs:
  publish-html5-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Make html5 build
        uses: bitDecayGames/lime-build-action@v0.0.38
        with:
          buildArgs: -final -D API_KEY=${{ secrets.ANALYTICS_TOKEN }} -D NG_APP_ID=${{ secrets.NG_APP_ID }} -D NG_ENCRYPTION_KEY=${{ secrets.NG_ENCRYPTION_KEY }}
          initScriptFile: ./bin/init_deps.sh

      - name: Upload html5 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: html5-build
          path: export/html5.zip
          retention-days: 5
